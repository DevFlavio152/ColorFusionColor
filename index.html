<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Enigma das Cores</title>
    
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="main-menu" class="capa-container">
    <div class="capa-content">
        <div class="capa-texto">
            <h1>O Enigma<br><span style="color: #2c3e50;">das Cores</span></h1>
            <p>Um panorama das cores</p>
            <button class="btn-play" onclick="showMap()">Jogar</button>
        </div>
        
        <div class="capa-visual">
            <img src="assets/imagemcapaB.png" class="capa-personagem" alt="Personagem Enigma das Cores">
        </div>
    </div>
</div>

  <div id="map-screen" class="full-screen-overlay" style="display: none;">
      <div class="map-card-premium">
          <h2 class="map-title">Mapa de Cores</h2>
          
          <div class="career-path">
              <div id="node-1" class="phase-node active" onclick="selectPhase(1)">1</div>
              <div class="path-line"></div>
              <div id="node-2" class="phase-node locked" onclick="selectPhase(2)">2</div>
              <div class="path-line"></div>
              <div id="node-3" class="phase-node locked" onclick="selectPhase(3)">3</div>
              <div class="path-line"></div>
              <div id="node-4" class="phase-node locked" onclick="selectPhase(4)">4</div>
          </div>
          
          <div class="phase-info-card">
              <h3 id="selected-phase-name">Fase 1: Primárias</h3>
              <button id="btn-start-phase" onclick="startGame()">Começar</button>
          </div>
      </div>
  </div>


    <div id="game-screen" style="display: none;">
        <div id="phase-intro" class="phase-overlay" style="display:none;">
            <div class="dialogue-container">
                <img id="dialogue-img" src="assets/personagem.png" alt="Mestre das Cores" class="dialogue-character">
                
                <div class="dialogue-box">
                    <h3 id="dialogue-title" class="dialogue-name">Mestre das Cores</h3>
                    <p id="dialogue-text" class="dialogue-content"></p>
                    <button class="btn-dialogue-next" onclick="closeIntro()">Começar!</button>
                </div>
            </div>
        </div>

        <div class="game-container" id="game-container">
            <div class="header">
                <span class="emoji">🌈</span>
                <h1>Enigma das Cores</h1>
            </div>
            <p id="game-instruction" style="font-size: 0.8rem; color: #7f8c8d;">Misture as cores para completar o círculo!</p>
            <div id="color-area"></div>
            <div class="wheel-container">
                <div id="chromatic-wheel" class="wheel-base"></div>
                <div class="wheel-center"></div>
            </div>
        </div>
    </div>

    <div id="error-overlay" style="display: none;">
        <div class="error-card">
            <h2>Ops!</h2>
            <p id="error-text">Tente outra combinação!</p>
            <button style="background: #e74c3c;" onclick="closeError()">Tentar Novamente</button>
        </div>
    </div>

    <div id="result-overlay" style="display: none;">
        <div class="result-card">
            <div id="final-color-display" style="width: 60px; height: 60px; margin: 0 auto 10px; border-radius: 50%;"></div>
            <h2 id="final-color-name">Cor</h2>
            <p id="color-psychology" style="font-size: 0.9rem;"></p>
            <button id="btn-continue" onclick="resetAfterMix()">Continuar</button>
        </div>
    </div>

    <div id="victory-overlay" class="phase-overlay" style="display: none;">
        <div class="victory-card">
            <h1>Magnífico!</h1>
            <p>O círculo está completo!</p>
            <img id="img-circulo-vitoria" 
                 src="https://i.postimg.cc/rwmFV97B/circulo-cromatico-(1).png" 
                 alt="Círculo Cromático">
            <button onclick="finishPhase()">Voltar ao Mapa</button>
        </div>
    </div>

    <div id="loading-overlay" class="full-screen-overlay" style="display: none; flex-direction: column; z-index: 9999; background: #455564; align-items: center; justify-content: center; position: fixed; inset: 0;">
        <div class="loader"></div>
        <h2 style="color: white; margin-top: 25px; font-family: 'Inter', sans-serif;">Carregando Fase 3...</h2>
        <p style="color: #cbd5e1; font-size: 0.95rem; font-family: 'Inter', sans-serif;">Preparando o estúdio de Mandalas</p>
    </div>

    <script src="script.js"></script>

      
</body>
</html>
